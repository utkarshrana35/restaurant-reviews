# Local stand-in for the CDN (CloudFront in production). It sits in front of LocalStack the way
# CloudFront sits in front of S3: browsers load images from here, never from the bucket.
#
# It serves only published images, at /<bucket>/restaurants/<file>, caches them, and answers 404
# for everything else, so uploads waiting under pending/ cannot be reached through it.

proxy_cache_path /var/cache/nginx/images levels=1:2 keys_zone=images:10m max_size=1g
                 inactive=7d use_temp_path=off;

server {
    listen 80;
    # Docker's internal DNS, so the "localstack" service name resolves at request time.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ~ "^/(?<bucket>[a-z0-9][a-z0-9.-]{1,61}[a-z0-9])/restaurants/(?<file>[A-Za-z0-9._-]+)$" {
        # Read-only, like a CDN distribution. (Allowing GET also allows HEAD.)
        limit_except GET {
            deny all;
        }

        proxy_pass http://localstack:4566/$bucket/restaurants/$file;

        proxy_cache images;
        # How long an image is kept is decided by the object's own Cache-Control header
        # (a year, for published images). These apply only when the origin sends none.
        proxy_cache_valid 200 7d;
        # Briefly cache misses too, as CDNs do, so a missing image is not fetched repeatedly.
        proxy_cache_valid 403 404 10s;
        proxy_cache_lock on;

        proxy_ignore_headers Set-Cookie;
        proxy_hide_header Set-Cookie;
        # Set below, so one stored with an object can never loosen them.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header Content-Security-Policy;

        # A second layer behind serving images from their own origin. Browsers must use the
        # stored Content-Type (always an image type the API detected) and never guess another.
        # Opened directly as a page, a response is sandboxed: an opaque origin with no scripts
        # and nothing allowed to load. Neither affects showing the image in an <img> tag.
        # CloudFront equivalent: a response headers policy on the image behaviour (see README).
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "sandbox; default-src 'none'" always;

        # HIT or MISS, for checking the cache from a browser or a test.
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        return 404;
    }
}
