packages:
  - common
  - backend
  - frontend

# Versions of shared dependencies and repo-wide tooling, defined once.
# Packages reference them as "catalog:" in their package.json.
catalog:
  '@eslint/js': ^10.0.1
  '@types/node': ^24.19.1
  concurrently: ^10.0.6
  eslint: ^10.12.0
  eslint-config-next: ^16.4.0
  eslint-config-prettier: ^10.1.8
  prettier: ^3.9.10
  esbuild: ^0.28.2
  husky: ^9.1.7
  lint-staged: ^17.6.0
  tsup: ^8.5.1
  typescript: ~6.0.3
  typescript-eslint: ^8.71.1
  vitest: ^5.0.3
  zod: ^4.6.5

# Refuse to install on a Node version outside the range in package.json "engines".
engineStrict: true

onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver
